name: Appli Android (APK)

# À chaque push sur main : tests, APK signée, puis publication dans une release GitHub
# (étiquette apk-<numéro>) que le téléphone télécharge. L'appli compare son numéro à celui de la
# dernière release pour proposer la mise à jour (Réglages).
#
# Signature : une seule fois, ajouter le secret ANDROID_KEYSTORE_PASSWORD (Settings › Secrets and
# variables › Actions). Au premier passage, la clé est créée, protégée par ce mot de passe, et
# enregistrée dans le dépôt (android/planning-release.p12). Sans le secret, l'APK est construite
# (artefact du passage) mais pas publiée.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      VITE_BUILD_NUMBER: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - name: Appli web pour Android
        run: npm run build:android

      - name: Clé de signature
        id: key
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret ANDROID_KEYSTORE_PASSWORD absent : APK signée avec une clé de débogage, non publiée."
            exit 0
          fi
          if [ ! -f android/planning-release.p12 ]; then
            # Même chiffrement fort que la sauvegarde (600 000 itérations) : le fichier est public.
            keytool -genkeypair -storetype PKCS12 -keystore android/planning-release.p12 -alias planning \
              -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Planning, O=Kuelitink" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" \
              -J-Dkeystore.pkcs12.keyPbeIterationCount=600000 \
              -J-Dkeystore.pkcs12.certPbeIterationCount=600000 \
              -J-Dkeystore.pkcs12.macIterationCount=600000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/planning-release.p12
            git commit -m "Clé de signature de l'APK (protégée par le secret ANDROID_KEYSTORE_PASSWORD)"
            git push
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Tests des widgets et APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - run: cp android/app/build/outputs/apk/release/app-release.apk planning.apk
      - uses: actions/upload-artifact@v4
        with:
          name: planning-apk
          path: |
            planning.apk
            android/app/build/widget-previews/
      - name: Publication
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-$BUILD_NUMBER" planning.apk \
            --target "$GITHUB_SHA" \
            --title "Planning pour Android n°$BUILD_NUMBER" \
            --latest \
            --notes "APK de Planning (calendrier, to-do, objectifs, chrono, cycle) avec les widgets « Aujourd'hui » et « Prochaine tâche ».

          Sur le téléphone : télécharger planning.apk, l'ouvrir, autoriser l'installation depuis le navigateur si Android le demande. Une nouvelle version s'installe par-dessus l'ancienne, sans perdre les données."
